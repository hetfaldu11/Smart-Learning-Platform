spring.application.name=${APPLICATION_NAME}
spring.main.banner-mode=${SPRING_MAIN_BANNER_MODE}


# ----------------------Database----------------------------------------

spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${JPA_PROPERTIES_HIBERNATE_FORMAT_SQL}

# ----------------------Redis----------------------------------------

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}

# ----------------------Mail----------------------------------------

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE}

# ----------------------JWT----------------------------------------

jwt.secret=${JWT_SECRET}
jwt.token.expiration.time.micro.seconds=${JWT_TOKEN_EXPIRATION_TIME_MICRO_SECONDS}
jwt.header=${JWT_HEADER}

# ----------------------Password reset----------------------------------------

password.reset.token.expiration.time.micro.seconds=${PASSWORD_RESET_TOKEN_EXPIRATION_TIME_MICRO_SECONDS}
otp.change.password.expiry.seconds=${OTP_CHANGE_PASSWORD_EXPIRY_SECONDS}
otp.change.password.resend.seconds=${OTP_CHANGE_PASSWORD_RESEND_SECONDS}

# ----------------------Email otp----------------------------------------

otp.email.expiry.time.seconds=${OTP_EMAIL_EXPIRY_TIME_SECONDS}
otp.email.resend.seconds=${OTP_EMAIL_RESEND_SECONDS}

# ----------------------Phone otp----------------------------------------

otp.phone.expiry.time.seconds=${OTP_PHONE_EXPIRY_TIME_SECONDS}
otp.phone.resend.seconds=${OTP_PHONE_RESEND_SECONDS}

# ----------------------Device----------------------------------------

device.id.cookie.name=${DEVICE_ID_COOKIE_NAME}
device.id.cookie.http_only=${DEVICE_ID_COOKIE_HTTP_ONLY}
device.id.cookie.secure=${DEVICE_ID_COOKIE_SECURE}
device.id.cookie.path=${DEVICE_ID_COOKIE_PATH}
device.id.cookie.same.site=${DEVICE_ID_COOKIE_SAME_SITE}
device.id.cookie.expiry.seconds=${DEVICE_ID_COOKIE_EXPIRY_SECONDS}

# ----------------------Useragent----------------------------------------

user.agent.header=${USER_AGENT_HEADER}

# ----------------------Session----------------------------------------

session.expiry.time.seconds=${SESSION_EXPIRY_TIME_SECONDS}
session.client.ip.header=${SESSION_CLIENT_IP_HEADER}

redis.rate_limit.database.address=${REDIS_RATE_LIMIT_DATABASE_ADDRESS}

spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

media.image.max-size=${MEDIA_IMAGE_MAX_SIZE}
media.video.max-size=${MEDIA_VIDEO_MAX_SIZE}
media.pdf.max-size=${MEDIA_PDF_MAX_SIZE}

spring.servlet.multipart.enabled=${SPRING_SERVLET_MULTIPART_ENABLED}